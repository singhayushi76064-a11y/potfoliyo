<style>

.btn:active{transform:scale(.96)}.btn:hover{filter:brightness(1.1)}.btn[disabled]{opacity:.55;cursor:not-allowed}.btn.block{width:100%}.btn.ghost{background:var(--surface2);border:1px solid var(--line);box-shadow:none}

.cont:nth-child(3){animation-delay:.06s}

.acts{display:flex;justify-content:center}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.b{justify-content:space-between}

input:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 3px #8b5cf655}

function slug(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function normTitle(s){return s.replace(/_/g,' ').trim().toLowerCase()}
async function loadCelebrities(){
  const seen=new Set(), all=[];
  for(const g of ['f','m']) for(const name of CELEB_NAMES[g]){
    const key=g+'|'+name.trim().toLowerCase();
    if(name && !seen.has(key)){seen.add(key);all.push({name:name.trim(),g});}
  }

  // Expand the catalogue with real public figures from Wikidata when internet is available.
  // This avoids inventing celebrity names; the built-in list still works if the request fails.
  if(all.length<3000){
    try{
      const sparql=`SELECT DISTINCT ?personLabel ?gender WHERE {
        ?person wdt:P31 wd:Q5; wdt:P106 ?occupation; wdt:P21 ?gender.
        VALUES ?occupation { wd:Q33999 wd:Q177220 wd:Q639669 wd:Q2526255 wd:Q2066131 wd:Q937857 wd:Q12299841 wd:Q4610556 wd:Q947873 wd:Q245068 wd:Q17125263 wd:Q5716684 wd:Q482980 wd:Q15981151 }
        VALUES ?gender { wd:Q6581072 wd:Q6581097 }
        SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
      } LIMIT 3400`;
      const endpoint='https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(sparql);
      const resp=await fetch(endpoint,{headers:{'Accept':'application/sparql-results+json'}});
      if(resp.ok){
        const data=await resp.json();
        for(const row of (data.results?.bindings||[])){
          const name=row.personLabel?.value?.trim(), gender=row.gender?.value||'';
          if(!name||name.includes('http')||name.length>80)continue;
          const g=gender.endsWith('Q6581072')?'f':gender.endsWith('Q6581097')?'m':null;
          if(!g)continue;
          const key=g+'|'+name.toLowerCase();
          if(!seen.has(key)){seen.add(key);all.push({name,g});}
          if(all.length>=3000)break;
        }
      }
    }catch(e){console.warn('Extra celebrity list unavailable; using built-in catalogue.',e)}
  }

  const found=new Map();
  // Fetch photo metadata in small concurrent groups so a large catalogue remains practical on mobile.
  const batches=Array.from({length:Math.ceil(all.length/50)},(_,i)=>all.slice(i*50,(i+1)*50));
  for(let start=0;start<batches.length;start+=5){
    await Promise.all(batches.slice(start,start+5).map(async batch=>{
      try{
        const url='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=500&titles='+encodeURIComponent(batch.map(x=>x.name).join('|'));
        const res=await fetch(url); if(!res.ok)return; const data=await res.json();
        const canonical=new Map();
        for(const x of (data.query?.normalized||[]))canonical.set(normTitle(x.from),normTitle(x.to));
        for(const x of (data.query?.redirects||[]))canonical.set(normTitle(x.from),normTitle(x.to));
        const pageMap=new Map(Object.values(data.query?.pages||{}).map(p=>[normTitle(p.title),p]));
        for(const x of batch){let key=normTitle(x.name),guard=0;while(canonical.has(key)&&guard++<5)key=canonical.get(key);const page=pageMap.get(key);if(page?.thumbnail?.source)found.set(x.g+'|'+x.name,{img:page.thumbnail.source,creditUrl:'https://en.wikipedia.org/wiki/'+encodeURIComponent(page.title.replace(/ /g,'_'))});}
      }catch(e){/* profiles still appear with a clear no-photo placeholder */}
    }));
  }
  DEMO=all.map(x=>{const f=found.get(x.g+'|'+x.name);return {id:'celeb-'+slug(x.g+'-'+x.name),g:x.g,name:x.name,age:30,celebrity:true,img:f?.img||null,credit:f?'Wikipedia page image':'Photo not found',creditUrl:f?.creditUrl||('https://en.wikipedia.org/w/index.php?search='+encodeURIComponent(x.name))};});
}

  root.append(h('div',{class:'hero'},h('h1',{},'Who is your favourite ',h('span',{class:'gt'},'celebrity?')),h('p',{class:'muted'},'Explore Indian and international stars across film, music, sport and entertainment. Vote for your favourite. Celebrity photos load from Wikipedia when available; internet is required for the expanded catalogue.')),tb,arena,h('div',{class:'foot'},next));dt();
  function pick(){const F=CH.filter(c=>c.g==='f'),M=CH.filter(c=>c.g==='m'),A=cat==='mixed'?F:inCat(cat),B=cat==='mixed'?M:A;
    if(cat==='mixed'?(!F.length||!M.length):A.length<2)return{r:'few'};
    const rnd=n=>Math.floor(Math.random()*n),flip=(a,b)=>Math.random()<.5?[b,a]:[a,b];
    for(let t=0;t<80;t++){const a=A[rnd(A.length)],b=B[rnd(B.length)];if(a.id!==b.id&&!votedSet.has(pk(a.id,b.id)))return{r:'ok',pair:flip(a,b)}}
    const open=[];for(const a of A)for(const b of B){if(a.id===b.id||(cat!=='mixed'&&a.id>b.id))continue;if(!votedSet.has(pk(a.id,b.id)))open.push([a,b])}   /* nearly everything voted: search exhaustively */
    if(!open.length)return{r:'done'};const p=open[rnd(open.length)];return{r:'ok',pair:flip(p[0],p[1])}}
  function box(c){return h('article',{class:'cont','data-id':c.id},pic(c),h('div',{class:'cname',text:c.name}),
    h('button',{class:'btn block vb',type:'button','aria-label':'Vote for '+c.name,onclick:()=>vote(c)},'Vote'),
    h('div',{class:'acts'},h('button',{class:'link',type:'button',onclick:()=>{location.hash='#p/'+c.id}},'Profile')))}
  function load(){busy=false;cur=pick();
    if(cur.r!=='ok'){arena.replaceChildren(h('div',{class:'card empty'},h('div',{class:'big','aria-hidden':'true'},'🌌'),h('h2',{},cur.r==='done'?'All caught up':'No matchups here yet'),
      h('p',{class:'muted'},cur.r==='done'?'You have voted on every pairing in this category. Try another category.':'This category needs more profiles to make a matchup. Try another category.'),h('button',{class:'btn',type:'button',onclick:()=>{location.hash='#vote'}},'Back to Vote')));return}
    arena.replaceChildren(h('div',{class:'arena'},box(cur.pair[0]),h('div',{class:'vs','aria-hidden':'true'},'VS'),box(cur.pair[1])))}
  async function vote(c){if(busy||cur.r!=='ok')return;busy=true;const o=cur.pair[0].id===c.id?cur.pair[1]:cur.pair[0],k=pk(c.id,o.id);

    try {
      const docId=user.uid+'_'+k.replace('|','_');
      await cloudDb.runTransaction(async tx=>{const ref=cloudDb.collection('votes').doc(docId);const old=await tx.get(ref);if(old.exists)throw Object.assign(new Error('already voted'),{code:'already-exists'});tx.set(ref,{uid:user.uid,w:c.id,l:o.id,pair:k,t:Date.now(),createdAt:firebase.firestore.FieldValue.serverTimestamp()});});
      document.querySelectorAll('.cont').forEach(x=>{const w=x.dataset.id===c.id;x.classList.add(w?'win':'dim');if(w)x.querySelector('.photo').append(h('div',{class:'tally',text:'Vote submitted'}))});

      else toast('Vote could not be saved. Check your connection and Firebase setup.',true);

    }

/* ---------- ranks ---------- */
V.ranks=root=>{let sort='votes';const tb=h('div'),so=h('div'),st=h('div'),ls=h('div');
  const SO=[['votes','Top'],['trending','Trending'],['winrate','Win rate'],['active','Most active']];
  function draw(){tb.replaceChildren(tabs(cat,k=>{cat=k;draw()}));
    so.replaceChildren(h('div',{class:'tabs',role:'group','aria-label':'Sort by'},SO.map(([k,l])=>h('button',{class:'tab',type:'button','aria-pressed':String(k===sort),onclick:()=>{sort=k;draw()}},l))));
    const since=Date.now()-864e5,today=c=>S.log.filter(v=>v.w===c.id&&v.t>since).length,W=c=>S.c[c.id].w,M=c=>S.c[c.id].m;
    let ps=inCat(cat);const total=ps.reduce((s,c)=>s+W(c),0),n=ps.length;
    if(sort==='winrate')ps=ps.filter(c=>M(c)>=5).sort((a,b)=>W(b)/M(b)-W(a)/M(a)||M(b)-M(a));
    else if(sort==='active')ps=ps.slice().sort((a,b)=>M(b)-M(a)||W(b)-W(a));
    else if(sort==='trending')ps=ps.slice().sort((a,b)=>today(b)-today(a)||W(b)-W(a));
    else ps=ps.slice().sort((a,b)=>W(b)-W(a)||M(b)-M(a));
    ps=ps.slice(0,50);
    st.replaceChildren(h('div',{class:'stats'},h('div',{class:'stat'},h('b',{},String(n)),h('span',{},'characters')),h('div',{class:'stat'},h('b',{},String(total)),h('span',{},'votes cast')),h('div',{class:'stat'},h('b',{},ps[0]&&W(ps[0])>0?ps[0].name:'–'),h('span',{},'leading'))));
    ls.replaceChildren(!ps.length?h('div',{class:'card empty'},h('p',{class:'muted'},sort==='winrate'?'Win rate appears after a character has 5 matchups. Keep voting!':'No characters are available in this category yet. Try another category.')):
      h('ol',{class:'lb'},ps.map((c,i)=>h('li',{},h('button',{type:'button',onclick:()=>{location.hash='#p/'+c.id}},h('span',{class:'rk'},String(i+1)),thumb(c),h('span',{class:'w'},h('b',{text:c.name}),h('span',{class:'m'},W(c)+' votes · '+M(c)+' matchups')),
        h('span',{class:'sc'},sort==='winrate'?rate(c)+'%':sort==='active'?String(M(c)):sort==='trending'?String(today(c)):String(W(c)),h('small',{},sort==='winrate'?'win rate':sort==='active'?'matchups':sort==='trending'?'votes today':'votes')))))))}
  root.append(h('h1',{},'Leaderboard'),tb,so,st,ls,h('p',{class:'muted small'},'Only the top 50 are shown. Rankings reflect votes in head-to-head matchups and nothing else.'));draw()};

(async()=>{await loadCelebrities();CUSTOM=[]; /* Studio and user-added profiles are intentionally disabled. */

    cloudVotesUnsub=cloudDb.collection('votes').onSnapshot(snap=>{
      S.log=S.log.filter(v=>v.uid==='local');
      snap.forEach(doc=>{const v=doc.data();if(v&&v.w&&v.l&&byId[v.w]&&byId[v.l])S.log.push({w:v.w,l:v.l,t:v.t||Date.now(),uid:v.uid,pair:v.pair||pk(v.w,v.l)});});
      S.c={};for(const c of CH)S.c[c.id]={w:0,m:0};
